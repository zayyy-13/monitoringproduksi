<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Terapkan tema tersimpan (sama dengan dashboard) -->
    <script>
        try { var t = localStorage.getItem("tbs_tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
    <title>Masuk · Monitoring Produksi TBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="data:,">   
    <script src="js/auth.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
</head>
<body>
    <div class="login-wrap">

        <!-- ========== SISI GAMBAR: hanya foto, sudut membulat ========== -->
        <section class="scene">
            <img class="foto" src="assets/sawit.jpeg" alt="Kebun dan buah kelapa sawit" draggable="false">
        </section>

        <!-- ========== SISI FORMULIR ========== -->
        <main class="panel">
            <button type="button" class="tema" id="temaToggle" aria-label="Ganti mode terang atau gelap" title="Mode terang / gelap">
                <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span class="lbl-gelap">Mode Gelap</span>
                <span class="lbl-terang">Mode Terang</span>
            </button>

            <form class="card" id="formMasuk" autocomplete="on" novalidate>
                <img class="logo-form" src="assets/logoo-.png" alt="Logo Monitoring">
                <h2>Selamat Datang</h2>
                <p class="sub">Masuk untuk membuka dashboard monitoring.</p>

                <p class="alert" id="pesan" role="alert" hidden></p>

                <div class="field">
                    <label for="nama">Nama pengguna</label>
                    <div class="input">
                        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        <input id="nama" name="username" type="text" placeholder="Masukkan nama pengguna" autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="field">
                    <label for="sandi">Kata sandi</label>
                    <div class="input">
                        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                        <input id="sandi" name="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
                        <button type="button" class="eye" id="lihatSandi" aria-label="Tampilkan kata sandi">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p class="caps" id="capsInfo" hidden>Caps Lock sedang aktif</p>
                </div>

                <div class="row">
                    <label><input type="checkbox" id="ingat"> Ingat saya</label>
                    <button type="button" class="tautan" id="lupaSandi">Lupa kata sandi?</button>
                </div>

                <button type="submit" class="btn" id="tombolMasuk">Masuk</button>
                <p class="foot">Akses hanya untuk pengguna terdaftar<br>© 2026 Monitoring Produksi TBS</p>
            </form>
        </main>
    </div>

    <script>
        // Foto bergeser mengikuti kursor / sentuhan, sehingga bagian yang terpotong
        // (saat jendela dikecilkan) bisa dilihat.
        (function () {
            const foto = document.querySelector(".foto");
            if (!foto) return;
            const awal = { x: 58, y: 50 };                       // posisi bawaan (persen)
            const tujuan = { x: awal.x, y: awal.y };
            const kini = { x: awal.x, y: awal.y };
            const kurangGerak = matchMedia("(prefers-reduced-motion: reduce)").matches;
            const batas = (n) => Math.max(0, Math.min(100, n));
            let jalan = false;

            function pasang() {
                foto.style.objectPosition = kini.x.toFixed(2) + "% " + kini.y.toFixed(2) + "%";
            }

            function langkah() {
                kini.x += (tujuan.x - kini.x) * 0.12;            // gerak halus menuju tujuan
                kini.y += (tujuan.y - kini.y) * 0.12;
                pasang();
                const dekat = Math.abs(tujuan.x - kini.x) < 0.05 && Math.abs(tujuan.y - kini.y) < 0.05;
                if (dekat) { jalan = false; return; }
                requestAnimationFrame(langkah);
            }

            function geser(x, y) {
                tujuan.x = x; tujuan.y = y;
                if (kurangGerak) { kini.x = x; kini.y = y; pasang(); return; }
                if (!jalan) { jalan = true; requestAnimationFrame(langkah); }
            }

            foto.addEventListener("pointermove", (e) => {
                const r = foto.getBoundingClientRect();
                geser(batas(((e.clientX - r.left) / r.width) * 100), batas(((e.clientY - r.top) / r.height) * 100));
            });
            foto.addEventListener("pointerleave", () => geser(awal.x, awal.y));   // kembali ke posisi awal
        })();
    </script>
    <script>
        // Mode terang / gelap — berdiri sendiri, tetap jalan walau auth.js gagal dimuat
        (function () {
            const aktif = () => document.documentElement.getAttribute("data-theme") ||
                (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.getElementById("temaToggle").addEventListener("click", () => {
                const baru = aktif() === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", baru);
                try { localStorage.setItem("tbs_tema", baru); } catch (e) { /* abaikan */ }
            });
        })();
    </script>
    <script>
        (function () {
            // auth.js wajib satu folder dengan halaman ini
            if (typeof Auth === "undefined") {
                const p = document.getElementById("pesan");
                p.textContent = "File auth.js tidak ditemukan. Simpan auth.js di folder yang sama dengan login.html.";
                p.hidden = false;
                document.getElementById("tombolMasuk").disabled = true;
                return;
            }
            if (Auth.sudahMasuk()) { location.replace(Auth.HALAMAN_UTAMA); return; }

            const $ = (id) => document.getElementById(id);
            const form = $("formMasuk"), nama = $("nama"), sandi = $("sandi"), ingat = $("ingat");
            const tombol = $("tombolMasuk"), pesan = $("pesan"), caps = $("capsInfo");
            let gagal = 0, kunciSampai = 0;

            const tampilPesan = (teks, info) => {
                pesan.textContent = teks;
                pesan.hidden = false;
                pesan.classList.toggle("info", !!info);
                if (!info) { form.classList.remove("goyang"); void form.offsetWidth; form.classList.add("goyang"); }
            };

            // Lihat / sembunyikan kata sandi
            $("lihatSandi").addEventListener("click", (e) => {
                const tampak = sandi.type === "text";
                sandi.type = tampak ? "password" : "text";
                e.currentTarget.setAttribute("aria-label", tampak ? "Tampilkan kata sandi" : "Sembunyikan kata sandi");
            });

            // Peringatan Caps Lock
            sandi.addEventListener("keyup", (e) => { caps.hidden = !(e.getModifierState && e.getModifierState("CapsLock")); });
            sandi.addEventListener("blur", () => { caps.hidden = true; });

            // Lupa kata sandi (tidak ada server, jadi arahkan ke administrator)
            $("lupaSandi").addEventListener("click", () => tampilPesan("Hubungi administrator untuk mengatur ulang kata sandi.", true));

            // Kirim formulir
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                pesan.hidden = true;
                if (!nama.value.trim() || !sandi.value) { tampilPesan("Isi nama pengguna dan kata sandi."); return; }
                const sisa = Math.ceil((kunciSampai - Date.now()) / 1000);
                if (sisa > 0) { tampilPesan("Terlalu banyak percobaan. Coba lagi dalam " + sisa + " detik."); return; }

                tombol.disabled = true; tombol.textContent = "Memeriksa…";
                try {
                    if (await Auth.masuk(nama.value, sandi.value, ingat.checked)) {
                        location.replace(Auth.HALAMAN_UTAMA);
                        return;
                    }
                    gagal++;
                    if (gagal >= 5) { gagal = 0; kunciSampai = Date.now() + 30000; tampilPesan("Terlalu banyak percobaan. Coba lagi dalam 30 detik."); }
                    else tampilPesan("Nama pengguna atau kata sandi salah.");
                } catch (err) {
                    tampilPesan("Login tidak bisa diproses di browser ini. Buka lewat https:// atau localhost.");
                }
                tombol.disabled = false; tombol.textContent = "Masuk";
                sandi.select();
            });
        })();
    </script>
</body>
</html>
